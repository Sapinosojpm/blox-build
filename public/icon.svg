<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF385C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="440" height="440" x="36" y="36" rx="96" fill="url(#logo-grad)" filter="url(#glow)" />
  
  <!-- Pixelated Letter B -->
  <!-- Left column -->
  <rect x="160" y="120" width="48" height="240" fill="#FFFFFF" />
  <!-- Top bar -->
  <rect x="208" y="120" width="96" height="48" fill="#FFFFFF" />
  <!-- Top right side -->
  <rect x="280" y="168" width="48" height="48" fill="#FFFFFF" />
  <!-- Middle bar -->
  <rect x="208" y="216" width="96" height="48" fill="#FFFFFF" />
  <!-- Bottom right side -->
  <rect x="280" y="264" width="48" height="48" fill="#FFFFFF" />
  <!-- Bottom bar -->
  <rect x="208" y="312" width="96" height="48" fill="#FFFFFF" />
</svg>
